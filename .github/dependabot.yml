# Each branch is locked to one Filament major (1.x = Filament v4, 2.x = Filament v5).
# Filament majors are ignored so Dependabot never proposes a cross-major bump on a branch.

version: 2

updates:

  # ---------- 1.x (Filament v4) ----------
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: 1.x
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions-deps:
        patterns:
          - "*"

  - package-ecosystem: "bun"
    directory: "/"
    target-branch: 1.x
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      npm-deps:
        patterns:
          - "*"

  - package-ecosystem: "composer"
    directory: "/"
    target-branch: 1.x
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "filament/*"
        update-types: ["version-update:semver-major"]
    groups:
      composer-deps:
        patterns:
          - "*"

  # ---------- 2.x (Filament v5) ----------
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: 2.x
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions-deps:
        patterns:
          - "*"

  - package-ecosystem: "bun"
    directory: "/"
    target-branch: 2.x
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      npm-deps:
        patterns:
          - "*"

  - package-ecosystem: "composer"
    directory: "/"
    target-branch: 2.x
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "filament/*"
        update-types: ["version-update:semver-major"]
    groups:
      composer-deps:
        patterns:
          - "*"
